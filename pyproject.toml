[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kroc-payload-mobo"
version = "0.2.0"
description = "Canonical KRoC geared joint tracking-energy MOBO and cross-payload transfer experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "matplotlib>=3.9,<4",
  "torch>=2.6,<3", "botorch==0.17.2", "gpytorch>=1.15,<1.16",
  "numba>=0.67,<0.68",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
kroc-mobo = "kroc_mobo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: small real BoTorch integration run"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
