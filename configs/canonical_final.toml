# Canonical Final Model — user specification, 2026-09-23.
# Motor/gear values supplied by the user; not independently identified on hardware.
# Numerical, noise, PID-search and optimizer settings are experimental design choices.
[metadata]
parameter_status = "CANONICAL FINAL | simulation"
description = "Maxon RE35 323890 + GP42C 126:1; user-specified constant-efficiency model"

[plant]
N = 126.0
eta = 0.72
J_g = 0.0000014             # 14 g cm^2, assumed input-side gear inertia
l = 0.20                    # uniform rigid link length, m
J_m = 0.00000812                  # kg m^2, rotor inertia
J_l = 0.006666666666666667                  # kg m^2, link inertia about joint (excludes rotor/payload)
m_l = 0.5                    # kg
r_l = 0.10                   # m, link COM distance
r_p = 0.20                   # m, point payload distance
b = 0.05                     # N m s/rad, combined viscous friction
R = 0.568                      # ohm
L = 0.000191                    # H
K_t = 0.0292                    # N m/A (user-specified RE35)
K_e = 0.0291                    # V s/rad; retain specified rounded constant
g = 9.81                     # m/s^2
gravity = true               # theta = 0 is downward vertical

[simulation]
duration = 5.0               # s
control_dt = 0.001           # s, zero-order-held voltage
integration_substeps = 16     # RK4 step = control_dt / integration_substeps
theta_start = 0.0            # rad
theta_end = 1.0471975512      # rad, 60 degree movement

[noise]
power = 1e-10                # rad^2 s; discrete variance = power/sample_dt
sample_dt = 0.001            # s; independent Gaussian draws, held between samples

[controller]
voltage_max = 24.0           # V
filter_tau = 0.020           # s
antiwindup_gain = 10.0       # 1/s; integral state has units V

[limits]
current_max = 3.84           # A; continuous-current reference used as hard peak feasibility bound; no clipping
angle_abs_max = 3.1415926536  # rad
velocity_abs_max = 15.0      # rad/s
numerical_abs_max = 1e8      # numerical guard, all physical states

[search]
kp = [0.0, 200.0]            # V/rad
ki = [0.0, 100.0]            # V/(rad s)
kd = [0.0, 20.0]             # V s/rad

[experiment]
payloads = [1.0, 2.0, 3.0]   # kg; constant within each rollout
nominal_payload = 1.0
repeats = 5
base_seed = 731
train_seed_base = 10000
selection_seed_base = 100000
test_seed_base = 200000
train_replicates = 3
selection_replicates = 5
test_replicates = 10

[mobo]
backend = "qlognehvi"        # log-stabilized qNEHVI; original qNEHVI failed with NaN gradients
n_initial = 10
n_evaluations = 40           # includes initial, infeasible, numerical-failure attempts
mc_samples = 128
num_restarts = 8
raw_samples = 128
fit_maxiter = 100
acq_maxiter = 100
torch_threads = 1
observation_variance_floor = 1e-6 # numerical regularization in scaled GP output units
objective_scales = [0.1, 10.0]  # fixed before optimization; JT rad, JE J
reference_point = [1.0, 20.0] # fixed after pilot (JE 2.57–9.98 J), before optimization

[pilot]
conservative = [20.0, 10.0, 1.0]
balanced = [70.0, 30.0, 5.0]
aggressive = [160.0, 70.0, 10.0]
